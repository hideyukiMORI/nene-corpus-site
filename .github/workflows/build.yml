name: Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-com:
    name: Build nene-corpus.com
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:com
      - uses: actions/upload-artifact@v4
        with:
          name: com-dist
          path: apps/com/dist/
          retention-days: 7

  build-dev:
    name: Build nene-corpus.dev
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build:dev
      - uses: actions/upload-artifact@v4
        with:
          name: dev-dist
          path: apps/dev/dist/
          retention-days: 7
